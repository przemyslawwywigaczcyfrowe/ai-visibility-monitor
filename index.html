<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Visibility</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap">
<style>
/* Look of the cyfrowe.pl product panels (white bar, white rail, #F0F4F9 canvas, Google Sans).
   One idea per screen: a colour matrix of prompts x models shows at a glance where we are recommended. */
:root {
  --paper:#F0F4F9; --card:#FFFFFF; --edge:#DADCE0; --rule:#E3E6EA; --hair:#EEF1F4; --track:#E3E8EF;
  --ink:#1F1F1F; --ink2:#444746; --muted:#5F6368; --faint:#80868B;
  --acc:#0B57D0; --acc-dark:#0842A0; --acc-soft:#D3E3FD; --acc-weak:#A8C7FA;
  --g1:#137333; --g2:#CEEAD6; --g2t:#0D652D; --g3:#E6F4EA; --g3t:#137333; --g0:#F1F3F4;
  --up:#137333; --up-soft:#E6F4EA; --down:#B3261E; --down-soft:#FCE8E6;
  --f:"Google Sans Flex","Google Sans Text","Google Sans",Roboto,Arial,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--paper); }
body { color:var(--ink); font-family:var(--f); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:6px; }
.num { font-variant-numeric:tabular-nums; }
.ic { width:20px; height:20px; fill:currentColor; display:block; flex:none; }
[hidden] { display:none !important; }

/* ---------- sign-in ---------- */
.brama { display:grid; place-items:center; min-height:100vh; padding:16px; }
body:not(.zamkniety) .brama { display:none; }
body.zamkniety .appbar, body.zamkniety .rail, body.zamkniety .main { display:none; }
.brama form { width:min(440px,100%); background:#fff; border:1px solid var(--edge); border-radius:28px; padding:40px 36px 32px; display:flex; flex-direction:column; gap:16px; }
.brama .logo-eig { width:96px; height:96px; border-radius:20px; background:#000 url(assets/eig-logo.png) center/cover; }
.brama h1 { font-size:30px; font-weight:600; letter-spacing:-.01em; }
.brama p { font-size:15px; color:var(--ink2); }
.brama input[type=password] { height:52px; border-radius:14px; border:1px solid var(--edge); padding:0 18px; font:400 16px var(--f); background:var(--paper); outline:none; }
.brama input[type=password]:focus { border-color:var(--acc); background:#fff; }
.brama label { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink2); cursor:pointer; }
.brama .postep { font-size:13.5px; color:var(--muted); min-height:20px; }
.brama .blad { font-size:14px; color:var(--down); font-weight:500; min-height:20px; }

/* ---------- shell ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px; border-radius:999px; border:1px solid var(--edge);
  background:#fff; color:var(--acc); font:500 14.5px var(--f); cursor:pointer; text-decoration:none; white-space:nowrap; }
.btn:hover { background:var(--hair); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
.btn.primary:hover { background:var(--acc-dark); }
.btn[disabled] { opacity:.6; cursor:default; }
.btn .ic { width:18px; height:18px; }

.appbar { position:fixed; top:0; left:0; right:0; height:64px; z-index:50; display:flex; align-items:center; gap:14px; padding:0 24px 0 16px;
  background:#fff; border-bottom:1px solid var(--edge); }
.appbar .logo { width:36px; height:36px; border-radius:10px; background:#000 url(assets/eig-mark.png) center/cover; flex:none; }
.appbar .marka { display:flex; flex-direction:column; line-height:1.15; white-space:nowrap; }
.appbar .marka b { font-size:20px; font-weight:500; }
.appbar .marka small { font-size:11.5px; color:var(--muted); font-weight:500; }
.appbar .gap { flex:1; }
.appbar .stan { font-size:13px; color:var(--muted); white-space:nowrap; }
.tabs { display:flex; align-self:stretch; margin-left:32px; }
.tabs button { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:0 18px; border:0; background:none; cursor:pointer;
  border-bottom:3px solid transparent; color:var(--muted); line-height:1.25; }
.tabs button b { font-size:15px; font-weight:600; color:var(--ink2); }
.tabs button span { font-size:12px; }
.tabs button:hover b { color:var(--ink); }
.tabs button.on { border-bottom-color:var(--acc); }
.tabs button.on b { color:var(--acc-dark); }

.rail { position:fixed; top:64px; left:0; bottom:0; width:80px; z-index:40; background:#fff; border-right:1px solid var(--edge);
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 0 16px; }
.rlink { width:72px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0 6px; border:0; background:none; cursor:pointer;
  color:var(--muted); font:500 11px/1.25 var(--f); text-align:center; }
.rlink .pg { width:56px; height:32px; border-radius:999px; display:grid; place-items:center; }
.rlink:hover .pg { background:var(--hair); color:var(--ink); }
.rlink.on { color:var(--acc-dark); font-weight:700; }
.rlink.on .pg { background:var(--acc-soft); }
.rail .dol { margin-top:auto; }

.main { margin:64px 0 0 80px; padding:36px 40px 64px; }
.wrap { max-width:1680px; margin:0 auto; }

/* ---------- page head ---------- */
.kicker { font-size:14px; color:var(--muted); }
.h1 { font-size:46px; font-weight:600; letter-spacing:-.02em; line-height:1.12; margin:6px 0 0; }
.h1 em { font-style:normal; color:var(--acc); }
.staty { display:flex; flex-wrap:wrap; gap:0; margin:26px 0 30px; }
.stat { padding:0 32px; border-left:1px solid #D5DCE6; min-width:0; }
.stat:first-child { padding-left:0; border-left:0; }
.stat .k { font-size:13.5px; color:var(--muted); white-space:nowrap; }
.stat .v { display:flex; align-items:baseline; gap:8px; margin-top:2px; }
.stat .v b { font-size:32px; font-weight:400; letter-spacing:-.02em; line-height:1.15; }
.stat .v small { font-size:15px; color:var(--muted); }
.stat svg { display:block; margin-top:6px; }
.chg { display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.chg.up { background:var(--up-soft); color:var(--up); } .chg.down { background:var(--down-soft); color:var(--down); } .chg.same { background:var(--hair); color:var(--muted); }

/* ---------- toolbar and legend ---------- */
.toolbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.toolbar .gap { flex:1; }
.seg { display:inline-flex; padding:4px; gap:2px; border-radius:999px; background:#E4E9F0; }
.seg button { border:0; background:transparent; font:500 14.5px var(--f); color:var(--ink2); height:40px; padding:0 18px; border-radius:999px; cursor:pointer; }
.seg button b { margin-left:6px; color:var(--muted); font-weight:600; }
.seg button.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(60,64,67,.2); }
.legend { display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--ink2); }
.legend .lb { color:var(--muted); }
.legend span.e { display:inline-flex; align-items:center; gap:7px; }
.legend i { width:24px; height:20px; border-radius:6px; display:inline-grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; }

/* ---------- cards ---------- */
.card { background:#fff; border:1px solid var(--edge); border-radius:24px; padding:26px 28px 24px; min-width:0; }
.card h2 { font-size:21px; font-weight:600; letter-spacing:-.005em; }
.card .sub { font-size:14px; color:var(--muted); margin-top:2px; }
.grid2 { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:24px; align-items:start; }
.side { display:flex; flex-direction:column; gap:24px; position:sticky; top:88px; }

/* ---------- matrix ---------- */
.mx { width:100%; border-collapse:separate; border-spacing:0; margin-top:18px; }
.mx th { font-size:13px; font-weight:500; color:var(--muted); text-align:center; padding:0 3px 10px; vertical-align:bottom; white-space:nowrap; }
.mx th.l { text-align:left; padding-left:0; }
.mx th.rg { font-size:14px; font-weight:600; color:var(--ink2); padding-bottom:2px; }
.mx th.rg small { display:block; font-size:12px; font-weight:500; color:var(--muted); }
.mx td { padding:3px; vertical-align:middle; }
.mx td.t { width:150px; padding:12px 16px 0 0; vertical-align:top; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); }
.mx td.t span { display:block; font-size:13px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--muted); margin-top:2px; }
.mx td.q { padding:8px 20px 8px 0; font-size:15px; color:var(--ink); line-height:1.35; }
.mx td.q small { display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
.mx tr.grp td { border-top:1px solid var(--rule); }
.mx tr.grp td.t, .mx tr.grp td.q { padding-top:16px; }
.mx tr.grp td.c { padding-top:14px; }
.mx td.c { width:104px; }
.mx td.gap { width:14px; padding:0; }
.mx tr.wiersz { cursor:pointer; }
.mx tr.wiersz:hover td.q { color:var(--acc-dark); }
.cell { position:relative; height:44px; border-radius:10px; display:grid; place-items:center; font-size:18px; font-weight:600; border:0; width:100%; cursor:pointer; font-variant-numeric:tabular-nums; }
.cell:hover { box-shadow:0 0 0 2px var(--acc); }
.p1 { background:var(--g1); color:#fff; } .p2 { background:var(--g2); color:var(--g2t); } .p3 { background:var(--g3); color:var(--g3t); }
.p0 { background:var(--g0); color:transparent; } .pe { background:repeating-linear-gradient(45deg,#FBE9E7,#FBE9E7 6px,#fff 6px,#fff 12px); color:var(--down); font-size:12px; }
.pn { background:#fff; border:1px dashed var(--edge); color:var(--faint); font-size:12px; font-weight:500; }
.cell .z { position:absolute; top:-6px; right:-6px; min-width:22px; height:20px; padding:0 5px; border-radius:999px; font-size:11px; font-weight:700; display:grid; place-items:center; border:2px solid #fff; }
.cell .z.up { background:var(--up); color:#fff; } .cell .z.down { background:var(--down); color:#fff; }
.overview .mx td.q { font-size:14.5px; }
.overview .mx td.c { width:84px; }
.overview .cell { height:38px; font-size:16px; }

/* ---------- market cards (overview) ---------- */
.rk-row { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin:28px 0 28px; }
.rk { text-align:left; background:#fff; border:1px solid var(--edge); border-radius:20px; padding:20px 22px 18px; cursor:pointer; color:inherit; transition:border-color .15s; }
.rk:hover { border-color:var(--acc); }
.rk .a { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); }
.rk .s { font-size:19px; font-weight:600; margin-top:2px; }
.rk .v { display:flex; align-items:baseline; gap:8px; margin-top:12px; }
.rk .v b { font-size:44px; font-weight:400; letter-spacing:-.03em; line-height:1; }
.rk .v small { font-size:15px; color:var(--muted); }
.rk .m { display:flex; gap:16px; font-size:13.5px; color:var(--ink2); margin-top:10px; }
.rk .m b { font-weight:600; }
.rk .o { display:block; margin-top:14px; font-size:13.5px; font-weight:500; color:var(--acc); }

/* ---------- side lists ---------- */
.lb { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
.lb .r { display:grid; grid-template-columns:22px minmax(0,1fr) 34px; gap:10px; align-items:center; }
.lb .r .n { font-size:12.5px; color:var(--faint); text-align:right; }
.lb .r .nm { font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb .r .nm em { font-style:normal; font-size:11.5px; font-weight:600; color:var(--acc-dark); background:var(--acc-soft); border-radius:999px; padding:1px 8px; margin-left:6px; }
.lb .r .br { grid-column:2; height:6px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:-4px; }
.lb .r .br i { display:block; height:100%; background:#9AA0A6; border-radius:3px; }
.lb .r.us .br i { background:var(--acc); }
.lb .r .v { grid-row:1; grid-column:3; text-align:right; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.lb .more { border:0; background:none; color:var(--acc); font:500 13.5px var(--f); cursor:pointer; text-align:left; padding:4px 0 0 32px; }
.nodata { font-size:14px; color:var(--muted); padding:12px 0; }

/* ---------- answer drawer ---------- */
.cien { position:fixed; inset:0; background:rgba(31,31,31,.32); z-index:80; display:none; }
.szuf { position:fixed; top:0; right:0; bottom:0; width:min(1180px,100vw); background:var(--paper); z-index:90; display:none; flex-direction:column; box-shadow:-8px 0 32px rgba(0,0,0,.12); }
.szuf.on { display:flex; } .cien.on { display:block; }
.szuf .sg { background:#fff; padding:24px 32px 22px; border-bottom:1px solid var(--edge); display:flex; gap:20px; align-items:flex-start; }
.szuf .sg .kicker { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.szuf .sg h3 { font-size:26px; font-weight:600; line-height:1.25; letter-spacing:-.01em; margin-top:6px; }
.szuf .sg .orig { font-size:15px; color:var(--muted); margin-top:4px; }
.szuf select { font:500 14px var(--f); color:var(--ink); background:var(--paper); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; cursor:pointer; }
.szuf .x { border:0; background:var(--hair); border-radius:999px; width:44px; height:44px; display:grid; place-items:center; cursor:pointer; flex:none; color:var(--ink2); }
.szuf .sb { overflow:auto; padding:24px 32px 48px; display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:20px; align-items:start; }
.ans { background:#fff; border:1px solid var(--edge); border-radius:20px; padding:22px 26px; min-width:0; }
.ans .h { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.ans .h b { font-size:19px; font-weight:600; }
.ans .h .meta { font-size:12.5px; color:var(--muted); margin-top:2px; }
.ans .badge { font-size:14px; font-weight:600; padding:7px 14px; border-radius:999px; white-space:nowrap; }
.ans .badge.p1 { background:var(--g1); color:#fff; } .ans .badge.p2 { background:var(--g2); color:var(--g2t); } .ans .badge.p3 { background:var(--g3); color:var(--g3t); }
.ans .badge.p0 { background:var(--g0); color:var(--muted); }
.ans .lab { font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:13px; padding:4px 12px; border-radius:999px; background:var(--hair); color:var(--ink2); }
.tag.us { background:var(--acc); color:#fff; font-weight:600; }
.tresc { font-size:14.5px; color:var(--ink2); line-height:1.65; border-top:1px solid var(--rule); margin-top:18px; padding-top:16px; }
.tresc p { margin:0 0 10px; } .tresc ul { margin:0 0 10px 20px; } .tresc li { margin:0 0 6px; }
.tresc h4 { font-size:15.5px; font-weight:700; color:var(--ink); margin:16px 0 6px; }
.tresc a { color:var(--acc); }
.tresc mark { background:var(--acc-soft); color:var(--acc-dark); font-weight:700; padding:0 3px; border-radius:4px; }

/* ---------- how it works ---------- */
.metoda { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px; margin-top:28px; }
.metoda h3 { font-size:16px; font-weight:600; margin:20px 0 4px; }
.metoda h3:first-of-type { margin-top:16px; }
.metoda p, .metoda li { font-size:15px; color:var(--ink2); line-height:1.6; }
.metoda ul { margin:4px 0 0 20px; }
.metoda code { font-size:13px; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:1px 6px; }

@media (max-width:1500px) { .grid2 { grid-template-columns:minmax(0,1fr) 360px; } .h1 { font-size:40px; } .stat { padding:0 22px; } }
@media (max-width:1280px) { .grid2 { grid-template-columns:minmax(0,1fr); } .side { position:static; } .rk-row { grid-template-columns:repeat(2, minmax(0,1fr)); } .metoda { grid-template-columns:minmax(0,1fr); } }
@media (max-width:900px) {
  body { overflow-x:hidden; }
  .rail { top:auto; bottom:0; width:100%; height:64px; flex-direction:row; justify-content:space-around; padding:6px 0; border-right:0; border-top:1px solid var(--edge); }
  .rail .dol { margin-top:0; }
  .main { margin-left:0; padding:20px 16px 96px; }
  .appbar { padding:0 12px; gap:10px; } .appbar .marka b { font-size:17px; }
  .tabs { margin-left:4px; overflow-x:auto; min-width:0; } .tabs button { padding:0 10px; }
  .tabs button span, .appbar .stan, .appbar .marka small { display:none; }
  .h1 { font-size:28px; overflow-wrap:anywhere; }
  .staty { display:grid; grid-template-columns:1fr 1fr; gap:16px 12px; }
  .stat { border-left:0; padding:0; } .stat .k { white-space:normal; } .stat .v b { font-size:28px; }
  .rk-row { grid-template-columns:minmax(0,1fr); }
  .card { padding:18px 16px; }
  .seg { flex-wrap:wrap; border-radius:20px; } .seg button { height:36px; padding:0 12px; font-size:13.5px; }
  .mx td.t, .mx th.l:first-child { display:none; }
  .mx td.c { width:68px; } .cell { height:40px; }
  .overview { overflow-x:auto; } .overview .mx { min-width:860px; }
  .szuf .sg { padding:16px; } .szuf .sg h3 { font-size:20px; } .szuf .sb { grid-template-columns:minmax(0,1fr); padding:16px; }
  .ans { padding:18px; }
}
</style>
</head>
<body class="zamkniety">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 007 6v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zm-6 9a2 2 0 110-4 2 2 0 010 4zm3.1-9H8.9V6a3.1 3.1 0 016.2 0v2z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
</defs></svg>

<div class="brama">
  <form id="brama-form" autocomplete="off">
    <span class="logo-eig" role="img" aria-label="European Imaging Group"></span>
    <h1>AI Visibility</h1>
    <p>Do ChatGPT and Google recommend our stores when customers ask for advice? Enter the password to open the panel.</p>
    <input type="password" id="haslo" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <label><input type="checkbox" id="pamietaj"> Remember on this device</label>
    <button class="btn primary" type="submit" id="otworz-btn"><svg class="ic"><use href="#i-lock"/></svg>Open</button>
    <div class="postep" id="postep" aria-live="polite"></div>
    <div class="blad" id="blad" role="alert"></div>
  </form>
</div>

<header class="appbar">
  <span class="logo" role="img" aria-label="European Imaging Group"></span>
  <span class="marka"><b>AI Visibility</b><small>European Imaging Group</small></span>
  <nav class="tabs" id="tabs" aria-label="Market"></nav>
  <span class="gap"></span>
  <span class="stan" id="stan"></span>
</header>

<nav class="rail" aria-label="Views">
  <button class="rlink" data-v="grupa"><span class="pg"><svg class="ic"><use href="#i-home"/></svg></span>Group</button>
  <button class="rlink" data-v="rynek"><span class="pg"><svg class="ic"><use href="#i-grid"/></svg></span>Market</button>
  <button class="rlink dol" data-v="metoda"><span class="pg"><svg class="ic"><use href="#i-info"/></svg></span>How it works</button>
  <button class="rlink" id="wyloguj"><span class="pg"><svg class="ic"><use href="#i-lock"/></svg></span>Sign out</button>
</nav>

<main class="main"><div class="wrap" id="tresc"></div></main>

<div class="cien" id="cien"></div>
<aside class="szuf" id="szuf" role="dialog" aria-modal="true" aria-labelledby="sz-h">
  <div class="sg"><div style="flex:1;min-width:0"><div class="kicker" id="sz-k"></div><h3 id="sz-h"></h3><div class="orig" id="sz-o"></div></div>
    <button class="x" id="sz-x" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div class="sb" id="sz-b"></div>
</aside>

<script>
/* ============================ AI VISIBILITY ============================
   Static panel on GitHub Pages. data/*.enc is encrypted with AES-256-GCM, the key is derived
   from the password in the browser (PBKDF2-SHA-256). config/config.json is public: prompts,
   English translations and the store watch list.
   ======================================================================= */
var REPO = 'przemyslawwywigaczcyfrowe/ai-visibility-monitor';
var KLUCZ = null, IDX = null, CFG = null, M = [], ENG = [], RUNS = {}, CELL = {}, DET = {}, START = {};
var stan = { v: 'grupa', rynek: 'PL', filtr: 'all', wiecej: false };
var MIES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ic(id) { return '<svg class="ic"><use href="#' + id + '"/></svg>'; }
function fmt(n, d) { return Number(n).toLocaleString('en-GB', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
/* Run times in the viewer's own time zone, with its name. */
function kiedy(run, krotko) {
  var iso = START[run]; if (!iso) return run || '';
  return new Date(iso).toLocaleString('en-GB', krotko ? { day: 'numeric', month: 'short' } :
    { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
}
function krotki(e) { return e.replace(' AI Mode', ''); }

/* ---------- decryption (same format as scripts/lib.mjs) ---------- */
function b64(s) { var b = atob(s.trim()), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function b64z(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function kluczZHasla(h) {
  var sol = await (await fetch('data/salt.json', { cache: 'no-store' })).json();
  var baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(h), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sol.salt), iterations: sol.iterations }, baza, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function odszyfruj(path) {
  var res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status === 404 ? 'NO_DATA' : 'HTTP ' + res.status);
  var raw = b64(await res.text());
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, KLUCZ, raw.slice(12));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
var PLIKI = {}, CACHE = {};
function szczegoly(run) {
  if (!CACHE[run]) CACHE[run] = odszyfruj('data/runs/' + PLIKI[run] + '.enc').then(function (o) { return o.details; });
  return CACHE[run];
}

/* ---------- data model ---------- */
async function wczytaj() {
  var w = await Promise.all([odszyfruj('data/index.enc'), fetch('config/config.json', { cache: 'no-store' }).then(function (r) { return r.json(); })]);
  IDX = w[0]; CFG = w[1];
  IDX.runs.forEach(function (r) { PLIKI[r.run] = r.file; START[r.run] = r.start; });
  ENG = IDX.engines.map(function (e) { return e.label; });
  CELL = {}; RUNS = {};
  IDX.hist.forEach(function (h) {
    CELL[h[0] + '|' + h[1] + '|' + h[2]] = h;
    var k = h[1].slice(0, 2); (RUNS[k] = RUNS[k] || []); if (RUNS[k].indexOf(h[0]) < 0) RUNS[k].push(h[0]);
  });
  Object.keys(RUNS).forEach(function (k) { RUNS[k].sort(); });
  M = IDX.markets.map(function (m) {
    var prompts = IDX.prompts.filter(function (p) { return p.market === m.code; }).map(function (p) {
      var n = +p.id.slice(2);
      return { id: p.id, n: n, text: p.text, topic: p.topic, en: (CFG.prompts_en && CFG.prompts_en[m.code] || [])[n - 1] || p.text, label: (CFG.labels || [])[n - 1] || p.text };
    });
    var re; try { re = new RegExp('(' + (m.pattern || m.store) + ')', 'gi'); } catch (e) { re = /$^/g; }
    return { code: m.code, name: m.name, city: m.city, store: m.store, domains: m.domains, re: re, prompts: prompts };
  });
  /* Latest run of every market, with full answers. */
  await Promise.all(M.map(function (m) { var r = ostatni(m); return r ? szczegoly(r).then(function (d) { DET[r] = d; }) : null; }));
}
function rynek(code) { return M.filter(function (m) { return m.code === code; })[0] || M[0]; }
function ostatni(m) { var r = RUNS[m.code] || []; return r[r.length - 1]; }
function poprzedni(m, run) { var r = RUNS[m.code] || []; var i = r.indexOf(run || ostatni(m)); return i > 0 ? r[i - 1] : null; }
function komorka(run, id, e) { return CELL[run + '|' + id + '|' + e] || null; }
function jest(run, id) { return ENG.some(function (e) { var c = komorka(run, id, e); return c && c[3] != null; }); }

function miary(m, run) {
  var o = { n: 0, ment: 0, eng: {}, poz: [], first: 0, cited: 0 };
  if (!run) return o;
  ENG.forEach(function (e) { o.eng[e] = 0; });
  m.prompts.forEach(function (p) {
    var cyt = false, any = false, zapytane = false;
    ENG.forEach(function (e) {
      var c = komorka(run, p.id, e); if (!c || c[6]) return;
      zapytane = true;
      if (c[3] != null) { any = true; o.eng[e]++; o.poz.push(c[3]); if (c[3] === 1) o.first++; }
      if (c[5]) cyt = true;
    });
    if (zapytane) o.n++; if (any) o.ment++; if (cyt) o.cited++;
  });
  o.avg = o.poz.length ? o.poz.reduce(function (a, b) { return a + b; }, 0) / o.poz.length : null;
  return o;
}
function sklepy(m, run) {
  var s = {};
  m.prompts.forEach(function (p) {
    ENG.forEach(function (e) {
      var c = komorka(run, p.id, e); if (!c || !c[4]) return;
      c[4].split('; ').forEach(function (nazwa, i) { var o = s[nazwa] = s[nazwa] || { name: nazwa, p: {}, first: 0 }; o.p[p.id] = 1; if (!i) o.first++; });
    });
  });
  return Object.keys(s).map(function (k) { s[k].count = Object.keys(s[k].p).length; return s[k]; })
    .sort(function (a, b) { return b.count - a.count || b.first - a.first; });
}
function domeny(m, run) {
  var d = {}, det = DET[run] || {};
  m.prompts.forEach(function (p) {
    ENG.forEach(function (e) { var z = det[p.id + '|' + e]; (z && z.sources ? z.sources.split(', ') : []).forEach(function (x) { (d[x] = d[x] || {})[p.id] = 1; }); });
  });
  return Object.keys(d).map(function (k) { return { name: k, count: Object.keys(d[k]).length, us: m.domains.some(function (x) { return k === x || k.slice(-(x.length + 1)) === '.' + x; }) }; })
    .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
}

/* ---------- small pieces ---------- */
/* Change chip for counts (more is better) or positions (less is better). */
function zmiana(teraz, przed, wiecejLepiej, nazwa) {
  if (przed == null || teraz == null) return '';
  var r = teraz - przed;
  if (Math.abs(r) < 1e-9) return '<span class="chg same" title="Same as the previous run">no change</span>';
  var dobrze = wiecejLepiej ? r > 0 : r < 0;
  return '<span class="chg ' + (dobrze ? 'up' : 'down') + '" title="' + esc(nazwa + ' in the previous run: ' + fmt(przed, wiecejLepiej ? 0 : 1)) + '">' + (dobrze ? '▲' : '▼') + ' ' + fmt(Math.abs(r), wiecejLepiej ? 0 : 1) + '</span>';
}
function spark(vals) {
  if (vals.length < 2) return '';
  var w = 120, h = 26, max = 25, pts = vals.map(function (v, i) { return [i * w / (vals.length - 1), h - 3 - (h - 6) * v / max]; });
  return '<svg width="' + w + '" height="' + h + '" aria-hidden="true"><polyline fill="none" stroke="#0B57D0" stroke-width="2" stroke-linejoin="round" points="' +
    pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/><circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="3" fill="#0B57D0"/></svg>';
}
function legenda() {
  return '<div class="legend" aria-label="Legend"><span class="lb">Our store in the answer:</span>' +
    '<span class="e"><i class="p1" style="color:#fff">1</i>named first</span><span class="e"><i class="p2">2</i>2nd or 3rd</span>' +
    '<span class="e"><i class="p3">4</i>4th or later</span><span class="e"><i class="p0"></i>not named</span>' +
    '<span class="e"><i style="background:var(--up);color:#fff;border-radius:999px;width:22px">▲</i>better than previous run</span></div>';
}
/* One answer as a coloured cell. The number is our place among the stores named in the answer. */
function cell(m, run, p, e) {
  var c = komorka(run, p.id, e), poprz = poprzedni(m, run), b = poprz ? komorka(poprz, p.id, e) : null, z = '';
  var opis = e + ': ';
  if (!c) return '<button class="cell pn" data-m="' + m.code + '" data-id="' + p.id + '" aria-label="' + esc(opis + 'not asked in this run') + '" title="Not asked in this run">n/a</button>';
  if (c[6]) return '<button class="cell pe" data-m="' + m.code + '" data-id="' + p.id + '" aria-label="' + esc(opis + 'error') + '" title="The model returned an error">error</button>';
  var v = c[3], a = b && !b[6] ? b[3] : undefined;
  if (a !== undefined) {
    if (v != null && a == null) z = '<span class="z up" title="Not named in the previous run">new</span>';
    else if (v == null && a != null) z = '<span class="z down" title="Named at place ' + a + ' in the previous run">lost</span>';
    else if (v != null && v !== a) z = '<span class="z ' + (v < a ? 'up' : 'down') + '" title="Place ' + a + ' in the previous run">' + (v < a ? '▲' : '▼') + Math.abs(v - a) + '</span>';
  }
  var kl = v == null ? 'p0' : v === 1 ? 'p1' : v <= 3 ? 'p2' : 'p3';
  var t = v == null ? 'our store is not named' : v === 1 ? 'our store is named first' : 'our store is store number ' + v + ' named';
  return '<button class="cell ' + kl + '" data-m="' + m.code + '" data-id="' + p.id + '" aria-label="' + esc(opis + t) + '" title="' + esc(opis + t + '. Click to read the answer.') + '">' + (v == null ? '' : v) + z + '</button>';
}
function tematy(m) {
  var t = [];
  m.prompts.forEach(function (p) { var o = t.filter(function (x) { return x.name === p.topic; })[0]; if (!o) t.push(o = { name: p.topic, prompts: [] }); o.prompts.push(p); });
  return t;
}

/* ---------- views ---------- */
function rysuj() {
  document.querySelectorAll('.rlink[data-v]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === stan.v); b.setAttribute('aria-current', b.getAttribute('data-v') === stan.v ? 'page' : 'false'); });
  document.getElementById('tabs').innerHTML = M.map(function (m) {
    return '<button data-m="' + m.code + '" class="' + (stan.v === 'rynek' && stan.rynek === m.code ? 'on' : '') + '"><b>' + esc(m.name) + '</b><span>' + esc(m.store) + '</span></button>';
  }).join('');
  document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { otworzRynek(b.getAttribute('data-m')); }; });
  var ost = IDX.runs[IDX.runs.length - 1];
  document.getElementById('stan').textContent = ost ? 'Latest run: ' + kiedy(ost.run) : '';
  var el = document.getElementById('tresc');
  if (stan.v === 'grupa') el.innerHTML = widokGrupy();
  else if (stan.v === 'rynek') el.innerHTML = widokRynku();
  else el.innerHTML = widokMetody();
  podepnij();
}
function otworzRynek(code) {
  stan.rynek = code; stan.v = 'rynek'; stan.filtr = 'all'; stan.wiecej = false;
  try { localStorage.setItem('aiv-market', code); } catch (e) {}
  rysuj(); window.scrollTo(0, 0);
}

function widokGrupy() {
  var w = M.map(function (m) { var run = ostatni(m); return { m: m, run: run, a: miary(m, run), b: miary(m, poprzedni(m)) }; });
  var ment = w.reduce(function (s, x) { return s + x.a.ment; }, 0), all = w.reduce(function (s, x) { return s + x.a.n; }, 0);
  var h = '<div class="kicker">European Imaging Group · ' + M.length + ' markets · 25 customer prompts per market, asked to ' + ENG.join(' and ') + '</div>' +
    '<h1 class="h1">Our stores are recommended in <em class="num">' + ment + ' of ' + all + '</em> prompts</h1>';
  h += '<div class="rk-row">' + w.map(function (x) {
    var hist = (RUNS[x.m.code] || []).map(function (r) { return miary(x.m, r).ment; });
    return '<button class="rk" data-m="' + x.m.code + '" aria-label="' + esc('Open ' + x.m.name) + '">' +
      '<span class="a"><span>' + esc(x.m.name) + '</span><span>' + esc(kiedy(x.run, true)) + '</span></span>' +
      '<span class="s" style="display:block">' + esc(x.m.store) + '</span>' +
      '<span class="v"><b class="num">' + x.a.ment + '</b><small>of ' + x.a.n + ' prompts</small>' + zmiana(x.a.ment, x.b.n ? x.b.ment : null, true, 'Prompts') + '</span>' +
      spark(hist) +
      '<span class="m">' + ENG.map(function (e) { return '<span>' + esc(krotki(e)) + ' <b>' + x.a.eng[e] + '</b></span>'; }).join('') + '<span>Named first <b>' + x.a.first + '</b></span></span>' +
      '<span class="o">Open ' + esc(x.m.name) + ' →</span></button>';
  }).join('') + '</div>';
  /* The 25 prompts are the same questions in every language, so one row compares the four markets. */
  var t = tematy(M[0]);
  var mx = '<thead><tr><th class="l" colspan="2"></th>' + M.map(function (m, i) {
    return (i ? '<th class="gap"></th>' : '') + '<th class="rg" colspan="' + ENG.length + '">' + esc(m.name) + '<small>' + esc(m.store) + '</small></th>';
  }).join('') + '</tr><tr><th class="l">Topic</th><th class="l">Prompt (English version)</th>' + M.map(function (m, i) {
    return (i ? '<th class="gap"></th>' : '') + ENG.map(function (e) { return '<th>' + esc(krotki(e)) + '</th>'; }).join('');
  }).join('') + '</tr></thead><tbody>';
  t.forEach(function (g) {
    g.prompts.forEach(function (p0, i) {
      mx += '<tr class="' + (i === 0 ? 'grp' : '') + '">' + (i === 0 ? '<td class="t" rowspan="' + g.prompts.length + '">' + esc(g.name) + '</td>' : '') +
        '<td class="q">' + esc(p0.label) + '</td>' + M.map(function (m, k) {
          var p = m.prompts.filter(function (x) { return x.n === p0.n; })[0];
          return (k ? '<td class="gap"></td>' : '') + ENG.map(function (e) { return '<td class="c">' + (p ? cell(m, ostatni(m), p, e) : '') + '</td>'; }).join('');
        }).join('') + '</tr>';
    });
  });
  h += '<section class="card overview"><div class="toolbar" style="margin:0"><div><h2>Every prompt in every market</h2><div class="sub">Each cell is one answer from the latest run. Click a cell to read the full answer.</div></div><span class="gap"></span>' + legenda() + '</div>' +
    '<table class="mx">' + mx + '</tbody></table></section>';
  return h;
}

function widokRynku() {
  var m = rynek(stan.rynek), run = ostatni(m), pop = poprzedni(m), a = miary(m, run), b = pop ? miary(m, pop) : null;
  if (!run) return '<h1 class="h1">No run yet for ' + esc(m.name) + '</h1>';
  var hist = (RUNS[m.code] || []).map(function (r) { return miary(m, r); });
  var h = '<div class="kicker">' + esc(m.name) + ' · ' + esc(m.store) + ' · run of ' + esc(kiedy(run)) + '</div>' +
    '<h1 class="h1">' + esc(m.store) + ' is recommended in <em class="num">' + a.ment + ' of ' + a.n + '</em> prompts</h1>';
  var st = ENG.map(function (e) {
    return '<div class="stat"><div class="k">' + esc(e) + ' recommends us in</div><div class="v"><b class="num">' + a.eng[e] + '</b><small>of ' + a.n + ' prompts</small>' + (b ? zmiana(a.eng[e], b.eng[e], true, 'Prompts') : '') + '</div>' +
      spark(hist.map(function (x) { return x.eng[e]; })) + '</div>';
  }).join('');
  st += '<div class="stat"><div class="k">Average place when named</div><div class="v"><b class="num">' + (a.avg == null ? '–' : fmt(a.avg, 1)) + '</b><small>1 = named first</small>' + (b && b.avg != null && a.avg != null ? zmiana(a.avg, b.avg, false, 'Average place') : '') + '</div></div>';
  st += '<div class="stat"><div class="k">Named first</div><div class="v"><b class="num">' + a.first + '</b><small>answers</small>' + (b ? zmiana(a.first, b.first, true, 'Answers') : '') + '</div></div>';
  st += '<div class="stat"><div class="k">Our website cited as a source</div><div class="v"><b class="num">' + a.cited + '</b><small>of ' + a.n + ' prompts</small>' + (b ? zmiana(a.cited, b.cited, true, 'Prompts') : '') + '</div></div>';
  h += '<div class="staty">' + st + '</div>';

  var lista = m.prompts.filter(function (p) { var j = jest(run, p.id); return stan.filtr === 'all' || (stan.filtr === 'yes' ? j : !j); });
  var tak = m.prompts.filter(function (p) { return jest(run, p.id); }).length;
  h += '<div class="grid2"><section class="card">' +
    '<div class="toolbar"><div class="seg" role="group" aria-label="Filter prompts">' +
    [['all', 'All prompts', m.prompts.length], ['yes', 'Recommended', tak], ['no', 'Not recommended', m.prompts.length - tak]].map(function (f) {
      return '<button data-f="' + f[0] + '" class="' + (stan.filtr === f[0] ? 'on' : '') + '">' + f[1] + '<b>' + f[2] + '</b></button>';
    }).join('') + '</div><span class="gap"></span><button class="btn" id="csv">' + ic('i-down') + 'Export CSV</button></div>' + legenda();
  if (!lista.length) h += '<div class="nodata">No prompt in this filter.</div>';
  else {
    var mx = '<thead><tr><th class="l">Topic</th><th class="l">Prompt' + (m.code !== 'UK' ? ' (English, original below)' : '') + '</th>' + ENG.map(function (e) { return '<th>' + esc(e) + '</th>'; }).join('') + '</tr></thead><tbody>';
    tematy({ prompts: lista }).forEach(function (g) {
      g.prompts.forEach(function (p, i) {
        mx += '<tr class="wiersz ' + (i === 0 ? 'grp' : '') + '" data-m="' + m.code + '" data-id="' + p.id + '">' + (i === 0 ? '<td class="t" rowspan="' + g.prompts.length + '">' + esc(g.name) + '</td>' : '') +
          '<td class="q">' + esc(p.en) + (m.code !== 'UK' ? '<small>' + esc(p.text) + '</small>' : '') + '</td>' +
          ENG.map(function (e) { return '<td class="c">' + cell(m, run, p, e) + '</td>'; }).join('') + '</tr>';
      });
    });
    h += '<table class="mx">' + mx + '</tbody></table>';
  }
  h += '</section><div class="side">';
  var sk = sklepy(m, run);
  if (!sk.some(function (x) { return x.name === m.store; })) sk.push({ name: m.store, count: 0, first: 0 });
  var nasz = sk.filter(function (x) { return x.name === m.store; })[0], pok = stan.wiecej ? sk : sk.slice(0, 10);
  /* Our store always stays on the list, even below the top 10. */
  if (pok.indexOf(nasz) < 0) pok = pok.concat([nasz]);
  h += '<section class="card"><h2>Who gets recommended</h2><div class="sub">Number of prompts (of ' + a.n + ') in which each store is named</div><div class="lb">' +
    pok.map(function (x) {
      var us = x.name === m.store;
      return '<div class="r ' + (us ? 'us' : '') + '"><span class="n">' + (sk.indexOf(x) + 1) + '</span><span class="nm">' + esc(x.name) + (us ? '<em>our store</em>' : '') + '</span><span class="v">' + x.count + '</span>' +
        '<span class="br"><i style="width:' + (x.count / a.n * 100) + '%"></i></span></div>';
    }).join('') + (sk.length > 10 ? '<button class="more" id="wiecej">' + (stan.wiecej ? 'Show top 10' : 'Show all ' + sk.length + ' stores') + '</button>' : '') + '</div></section>';
  var dm = domeny(m, run).slice(0, 8);
  h += '<section class="card"><h2>Most cited websites</h2><div class="sub">Number of prompts in which the models used the website as a source</div><div class="lb">' +
    (dm.length ? dm.map(function (x, i) {
      return '<div class="r ' + (x.us ? 'us' : '') + '"><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(x.name) + (x.us ? '<em>our website</em>' : '') + '</span><span class="v">' + x.count + '</span>' +
        '<span class="br"><i style="width:' + (x.count / a.n * 100) + '%"></i></span></div>';
    }).join('') : '<div class="nodata">No sources in this run.</div>') + '</div></section></div></div>';
  return h;
}

function widokMetody() {
  var ost = IDX.runs[IDX.runs.length - 1] || {};
  var mod = IDX.engines.map(function (e) { return '<li><b>' + esc(e.label) + '</b>: <code>' + esc(e.model) + '</code>' + (e.note ? '. ' + esc(e.note) + '.' : '') + '</li>'; }).join('');
  return '<div class="kicker">How it works</div><h1 class="h1">What the panel measures</h1><div class="metoda">' +
    '<section class="card"><h2>Reading the panel</h2>' +
    '<h3>Recommended</h3><p>A prompt counts as "recommended" when the answer names our store in its text or links to our website. In the group and market totals a prompt counts when at least one model recommends us.</p>' +
    '<h3>The number in a cell</h3><p>Our place among the stores the answer names, in the order it names them. 1 means our store is named first. Only stores from the watch list in <code>config/config.json</code> are counted. An empty grey cell means our store is not named.</p>' +
    '<h3>Named first</h3><p>Number of answers (not prompts) in which our store is the first store named. Every prompt has one answer per model.</p>' +
    '<h3>Our website cited as a source</h3><p>Prompts where at least one answer lists a page of our website among its sources, the links the model shows as evidence. A store can be cited without being named, and the other way round.</p>' +
    '<h3>Changes</h3><p>▲ and ▼ compare a run with the previous run of the same market. "New" means recommended now but not before, "lost" the other way round. Answers vary from day to day, so read the trend over several runs.</p></section>' +
    '<section class="card"><h2>How it is measured</h2>' +
    '<h3>Models</h3><ul>' + mod + '</ul><p>The models are called through their API with web search on. The consumer apps add their own instructions, so an answer in the app can differ from the one shown here.</p>' +
    '<h3>Clean context</h3><p>Every prompt is a new conversation with no history, no account and no mention of our stores. The only extra information is the customer\'s approximate location (' + esc(M.map(function (m) { return m.city; }).join(', ')) + '), which the apps also know.</p>' +
    '<h3>Prompts</h3><p>' + M.length + ' markets × 25 prompts in the local language. Prompt number N is the same question in every market, so the group view compares markets row by row.</p>' +
    '<h3>Schedule</h3><p>Every day at 07:00 UTC. Latest run: ' + esc(kiedy(ost.run)) + (ost.cost ? ', cost ' + fmt(ost.cost, 2) + ' USD' : '') + '.</p>' +
    '<h3>Privacy</h3><p>Results are encrypted (AES-256) before they are stored. The password never leaves your device.</p>' +
    '<p style="margin-top:18px"><a class="btn" href="https://github.com/' + REPO + '/actions/workflows/measure.yml" target="_blank" rel="noopener">' + ic('i-play') + 'Run a measurement now (admins, needs GitHub access)</a></p></section></div>';
}

function podepnij() {
  document.querySelectorAll('.rk').forEach(function (b) { b.onclick = function () { otworzRynek(b.getAttribute('data-m')); }; });
  document.querySelectorAll('.cell').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); otworz(b.getAttribute('data-m'), b.getAttribute('data-id')); }; });
  document.querySelectorAll('tr.wiersz').forEach(function (tr) { tr.onclick = function () { otworz(tr.getAttribute('data-m'), tr.getAttribute('data-id')); }; });
  document.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { stan.filtr = b.getAttribute('data-f'); rysuj(); }; });
  var w = document.getElementById('wiecej'); if (w) w.onclick = function () { stan.wiecej = !stan.wiecej; rysuj(); };
  var c = document.getElementById('csv'); if (c) c.onclick = csv;
}

/* ---------- CSV: latest run of the market, one row per prompt and model ---------- */
function csv() {
  var m = rynek(stan.rynek), run = ostatni(m), det = DET[run] || {};
  function f(v) { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var w = ['market,run,prompt_id,topic,prompt,prompt_english,model,our_place,stores_in_order,our_url,sources'];
  m.prompts.forEach(function (p) {
    ENG.forEach(function (e) {
      var c = komorka(run, p.id, e), z = det[p.id + '|' + e] || {}; if (!c) return;
      w.push([m.code, run, p.id, p.topic, p.text, p.en, e, c[3] == null ? 'not named' : c[3], c[4], z.url, z.sources].map(f).join(','));
    });
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + w.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ai-visibility-' + m.code + '-' + run.replace(/[ :]/g, '') + '.csv';
  a.click();
}

/* ---------- answer drawer ---------- */
function formatuj(t, re) {
  var out = [], lista = false;
  esc(t).split(/\n/).forEach(function (l) {
    l = l.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
    l = l.replace(/(<a [^>]*>.*?<\/a>)|([^<]+)/g, function (x, a, txt) { return a ? a : txt.replace(re, '<mark>$1</mark>'); });
    var li = /^\s*([-*•]|\d+\.)\s+/.test(l);
    if (li && !lista) { out.push('<ul>'); lista = true; }
    if (!li && lista) { out.push('</ul>'); lista = false; }
    if (/^#{1,4}\s/.test(l)) out.push('<h4>' + l.replace(/^#+\s/, '') + '</h4>');
    else if (li) out.push('<li>' + l.replace(/^\s*([-*•]|\d+\.)\s+/, '') + '</li>');
    else if (l.trim() && !/^[-*_]{3,}$/.test(l.trim())) out.push('<p>' + l + '</p>');
  });
  if (lista) out.push('</ul>');
  return out.join('');
}
var fokus = null;
async function otworz(code, id, run) {
  var m = rynek(code), p = m.prompts.filter(function (x) { return x.id === id; })[0];
  run = run || ostatni(m);
  if (!document.getElementById('szuf').classList.contains('on')) fokus = document.activeElement;
  var runy = (RUNS[m.code] || []).slice().reverse();
  document.getElementById('sz-k').innerHTML = '<span>' + esc(m.name + ' · ' + m.store + ' · ' + p.topic) + ' · answers from</span><select id="sz-run" aria-label="Run">' +
    runy.map(function (r) { return '<option value="' + esc(r) + '"' + (r === run ? ' selected' : '') + '>' + esc(kiedy(r)) + '</option>'; }).join('') + '</select>';
  document.getElementById('sz-h').textContent = p.en;
  document.getElementById('sz-o').textContent = m.code !== 'UK' ? 'Original prompt: ' + p.text : '';
  document.getElementById('sz-run').onchange = function (e) { otworz(code, id, e.target.value); };
  document.getElementById('szuf').classList.add('on'); document.getElementById('cien').classList.add('on');
  document.getElementById('sz-x').focus();
  var cel = document.getElementById('sz-b');
  if (!DET[run]) {
    cel.innerHTML = '<div class="ans"><div class="nodata">Loading the answers…</div></div>';
    try { DET[run] = await szczegoly(run); } catch (err) { cel.innerHTML = '<div class="ans"><div class="nodata">Could not load: ' + esc(err.message) + '</div></div>'; return; }
    if (document.getElementById('sz-run').value !== run) return;
  }
  var det = DET[run];
  cel.innerHTML = ENG.map(function (e) {
    var c = komorka(run, id, e), z = det[id + '|' + e];
    var head = '<div class="h"><div><b>' + esc(e) + '</b>';
    if (!c || !z) return '<div class="ans">' + head + '</div></div><div class="nodata">This prompt was not asked in this run.</div></div>';
    if (c[6]) return '<div class="ans">' + head + '</div></div><div class="nodata">The model returned an error: ' + esc(z.error) + '</div></div>';
    var v = c[3], st = c[4] ? c[4].split('; ') : [], src = z.sources ? z.sources.split(', ') : [];
    return '<div class="ans">' + head + '<div class="meta">' + esc(z.model) + ' · answered ' + esc(new Date(z.time).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' })) + '</div></div>' +
      '<span class="badge ' + (v == null ? 'p0' : v === 1 ? 'p1' : v <= 3 ? 'p2' : 'p3') + '">' + (v == null ? 'Not named' : v === 1 ? 'Named first' : 'Named ' + v + (v === 2 ? 'nd' : v === 3 ? 'rd' : 'th')) + '</span></div>' +
      '<div class="lab">Stores named, in order</div><div class="tags">' + (st.length ? st.map(function (s, i) { return '<span class="tag ' + (s === m.store ? 'us' : '') + '">' + (i + 1) + '. ' + esc(s) + '</span>'; }).join('') : '<span class="tag">No store from the watch list</span>') + '</div>' +
      '<div class="lab">Sources</div><div class="tags">' + (src.length ? src.map(function (s) {
        var us = m.domains.some(function (x) { return s === x || s.slice(-(x.length + 1)) === '.' + x; });
        return '<span class="tag ' + (us ? 'us' : '') + '">' + esc(s) + '</span>';
      }).join('') : '<span class="tag">None</span>') + '</div>' +
      '<div class="tresc">' + formatuj(z.answer, m.re) + '</div></div>';
  }).join('');
  cel.scrollTop = 0;
}
function zamknij() {
  document.getElementById('szuf').classList.remove('on'); document.getElementById('cien').classList.remove('on');
  if (fokus && fokus.focus) fokus.focus();
}
document.getElementById('sz-x').onclick = zamknij;
document.getElementById('cien').onclick = zamknij;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') zamknij(); });

/* ---------- sign-in ---------- */
async function start(haslo, pamietaj) {
  var post = document.getElementById('postep');
  if (haslo) { post.textContent = 'Checking the password…'; KLUCZ = await kluczZHasla(haslo); }
  post.textContent = 'Decrypting the data…';
  await wczytaj();
  if (haslo) {
    var raw = b64z(new Uint8Array(await crypto.subtle.exportKey('raw', KLUCZ)));
    try { sessionStorage.setItem('aiv-key', raw); if (pamietaj) localStorage.setItem('aiv-key', raw); } catch (e) {}
  }
  post.textContent = '';
  try { var r = localStorage.getItem('aiv-market'); if (r && M.some(function (m) { return m.code === r; })) stan.rynek = r; } catch (e) {}
  document.body.classList.remove('zamkniety');
  rysuj();
}
document.getElementById('brama-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var bl = document.getElementById('blad'), btn = document.getElementById('otworz-btn');
  bl.textContent = ''; btn.disabled = true;
  try { await start(document.getElementById('haslo').value, document.getElementById('pamietaj').checked); }
  catch (err) {
    var t = String(err && (err.name + ' ' + err.message));
    bl.textContent = /NO_DATA/.test(t) ? 'There are no results yet. The first measurement has not finished.' :
      /OperationError|decrypt/i.test(t) ? 'Wrong password. Check it and try again.' : 'Could not load the data: ' + (err && err.message || err);
    document.getElementById('postep').textContent = '';
  }
  btn.disabled = false;
});
document.querySelectorAll('.rlink[data-v]').forEach(function (b) { b.onclick = function () { stan.v = b.getAttribute('data-v'); rysuj(); window.scrollTo(0, 0); }; });
document.getElementById('wyloguj').onclick = function () { try { sessionStorage.removeItem('aiv-key'); localStorage.removeItem('aiv-key'); } catch (e) {} location.reload(); };
(async function () {
  var s = null;
  try { s = sessionStorage.getItem('aiv-key') || localStorage.getItem('aiv-key'); } catch (e) {}
  if (s) {
    try { KLUCZ = await crypto.subtle.importKey('raw', b64(s), { name: 'AES-GCM' }, true, ['decrypt']); await start(); return; }
    catch (e) { try { sessionStorage.removeItem('aiv-key'); localStorage.removeItem('aiv-key'); } catch (x) {} }
  }
  document.getElementById('haslo').focus();
})();
</script>
