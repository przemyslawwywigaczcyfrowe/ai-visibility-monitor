name: Public access (on/off)

# "on": the panel opens without a password. "off": the sign-in screen comes back
# (then also change PANEL_PASSWORD, because the published key opens all data written so far).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'on or off'
        required: true
        default: 'on'
        type: choice
        options: ['on', 'off']

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: node scripts/public-key.mjs ${{ inputs.mode }}
      - run: |
          git config user.name "ai-visibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Public access ${{ inputs.mode }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
