name: Switch to personal accounts (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-encrypt with the data key
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: node scripts/migrate.mjs
      - name: Commit
        run: |
          git config user.name "ai-visibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Switch to personal accounts: data under the new key"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
