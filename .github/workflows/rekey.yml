name: Re-encrypt with new password

# Run after changing the PANEL_PASSWORD secret. Moves all results to a key derived from the new password.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measure   # never at the same time as a measurement
  cancel-in-progress: false

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: node scripts/rekey.mjs
      - run: |
          git config user.name "ai-visibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Re-encrypted with a new password"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
