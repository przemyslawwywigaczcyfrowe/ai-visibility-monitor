name: Measure AI visibility

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 09:00 Warsaw (summer time), 08:00 (winter time)
  workflow_dispatch:
    inputs:
      markets:
        description: 'Only these markets, e.g. PL,UK (empty = all)'
        required: false
        default: ''
      prompts:
        description: 'Only these prompt ids, e.g. PL01,DE16 (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest data, not the commit the run was queued on
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask the models
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          MARKETS: ${{ inputs.markets }}
          PROMPTS: ${{ inputs.prompts }}
          EVENT: ${{ github.event_name }}
        run: node scripts/measure.mjs
      - name: Commit encrypted results
        run: |
          git config user.name "ai-visibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Measurement $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: Export summary numbers to Puls sklepu (cyfrowe.pl)
        # Only counts and prompt ids, no answers. A failure here must not fail the measurement.
        continue-on-error: true
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/export-puls.mjs
