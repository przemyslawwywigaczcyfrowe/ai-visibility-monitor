name: Keep schedule alive

# GitHub disables scheduled workflows after 60 days without a commit.
# The daily measurement commits, but if it ever stops, this keeps the schedule from being disabled.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "ai-visibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep schedule alive"
          git push
